<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Global Miles Sweet Spot Finder</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --best: #10b981;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 20px 16px 48px;
      background: var(--bg); color: var(--text);
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 18px; }
    .controls {
      background: var(--card); padding: 16px; border-radius: 14px;
      display: flex; flex-direction: column; gap: 12px; margin-bottom: 18px;
      border: 1px solid var(--border);
    }
    label { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
    select, input {
      width: 100%; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f172a; color: var(--text); font-size: 0.95rem; margin-top: 4px;
    }
    .result-card {
      background: var(--card); border-radius: 14px; padding: 16px;
      margin-bottom: 12px; border: 1px solid var(--border);
    }
    .result-card.lowest { border: 2px solid var(--best); }
    .badge {
      display: inline-block; background: var(--best); color: #052e16;
      font-size: 0.7rem; font-weight: 800; padding: 3px 8px;
      border-radius: 99px; margin-bottom: 8px; text-transform: uppercase;
    }
    .row-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .program { font-size: 1.05rem; font-weight: 700; }
    .points { font-size: 1.2rem; font-weight: 800; color: var(--accent); white-space: nowrap; }
    .lowest .points { color: var(--best); }
    .airline { font-size: 0.88rem; color: #cbd5e1; margin-top: 4px; }
    .note { font-size: 0.8rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .btn-link {
      display: inline-block; margin-top: 12px; padding: 8px 12px;
      background: rgba(56, 189, 248, 0.12); color: var(--accent);
      text-decoration: none; font-size: 0.82rem; font-weight: 600;
      border-radius: 8px; border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .empty { text-align: center; color: var(--muted); padding: 24px; font-size: 0.9rem; }
  </style>
</head>

    function render() {
      const route = document.getElementById("route").value;
      const cabin = document.getElementById("cabin").value;
      const filter = document.getElementById("programFilter").value;
      const container = document.getElementById("results");

      let options = awardData[route][cabin] || [];

      if (filter !== "ALL") {
        options = options.filter(item => item.tag === filter);
      }

      if (options.length === 0) {
        container.innerHTML = `<div class="empty">No published Saver data for this cabin/filter combination. Try switching to Business or Economy.</div>`;
        return;
      }

      // Sort lowest points first
      options = [...options].sort((a, b) => a.points - b.points);

      container.innerHTML = options.map((item, idx) => `
        <div class="result-card ${idx === 0 ? 'lowest' : ''}">
          ${idx === 0 ? '<span class="badge">Lowest Points</span>' : ''}
          <div class="row-top">
            <span class="program">${item.program}</span>
            <span class="points">${item.points.toLocaleString()} pts</span>
          </div>
          <div class="airline">Operating Airline: <strong>${item.airline}</strong></div>
          <div class="note">${item.note}</div>
          <a class="btn-link" href="${links[item.tag]}" target="_blank" rel="noopener">Check ${item.tag} Availability ↗</a>
        </div>
      `).join("");
    }
