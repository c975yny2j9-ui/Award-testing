<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SG Miles Award Finder</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0f172a" />
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-hover: #263349;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --gold: #fbbf24;
      --gold-soft: rgba(251, 191, 36, 0.14);
      --green: #34d399;
      --green-soft: rgba(52, 211, 153, 0.14);
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: env(safe-area-inset-top) 16px 40px 16px;
      line-height: 1.45;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
      padding-top: 20px;
    }

    header {
      margin-bottom: 20px;
    }

    h1 {
      font-size: 1.55rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    /* Navigation Tabs */
    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--surface);
      padding: 5px;
      border-radius: 14px;
      border: 1px solid var(--border);
      margin-bottom: 18px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 11px 12px;
      font-size: 0.92rem;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: var(--accent);
      color: #0f172a;
      box-shadow: 0 2px 8px rgba(56, 189, 248, 0.25);
    }

    /* Controls Card */
    .controls-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .control-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
    }

    @media (min-width: 560px) {
      .control-row.two-col {
        grid-template-columns: 1fr 1fr;
      }
    }

    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    select {
      width: 100%;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.98rem;
      font-weight: 500;
      appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://w3.org' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
      background-repeat: no-repeat;
      background-position: right 14px center;
      background-size: 16px;
      cursor: pointer;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* Cabin Toggle */
    .cabin-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: var(--bg);
      padding: 4px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .cabin-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 9px;
      font-size: 0.9rem;
      font-weight: 600;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .cabin-btn.active {
      background: var(--surface-hover);
      color: var(--text);
      border: 1px solid var(--border);
    }

    /* Results Section */
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 2px;
    }

    .results-title {
      font-size: 1rem;
      font-weight: 700;
    }

    .results-badge {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .results-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .award-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      position: relative;
      transition: transform 0.15s ease;
    }

    .award-card.rank-1 {
      border-color: rgba(251, 191, 36, 0.5);
      background: linear-gradient(145deg, #1e293b 0%, rgba(251, 191, 36, 0.06) 100%);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      margin-bottom: 10px;
    }

    .rank-tag {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 6px;
    }

    .rank-1 .rank-tag {
      background: var(--gold-soft);
      color: var(--gold);
    }

    .rank-other .rank-tag {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .program-name {
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--text);
    }

    .alliance {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .miles-box {
      text-align: right;
      flex-shrink: 0;
    }

    .miles-amount {
      font-size: 1.38rem;
      font-weight: 800;
      color: var(--green);
      letter-spacing: -0.02em;
    }

    .miles-label {
      font-size: 0.72rem;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .flight-details {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 11px 13px;
      margin-top: 8px;
      font-size: 0.88rem;
    }

    .flight-route {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .flight-note {
      color: var(--text-muted);
      font-size: 0.82rem;
    }

    .savings-pill {
      display: inline-block;
      margin-top: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--green);
      background: var(--green-soft);
      padding: 4px 10px;
      border-radius: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px dashed var(--border);
      color: var(--text-muted);
      font-size: 0.92rem;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>✈️ SG Miles Award Finder</h1>
      <p class="subtitle">Top 3 lowest one-way redemptions across SG-accessible airline programmes</p>
    </header>

    <!-- Mode Switcher Tabs -->
    <div class="tabs" role="tablist">
      <button class="tab-btn active" id="tab-default" onclick="switchTab('default')">
        🇸🇬 From Singapore
      </button>
      <button class="tab-btn" id="tab-nearby" onclick="switchTab('nearby')">
        🌏 Nearby Hubs (Reposition)
      </button>
    </div>

    <!-- Search Filters -->
    <div class="controls-card">
      <div class="control-row" id="origin-row" style="display: none;">
        <div>
          <label for="origin-select">Reposition Origin Hub</label>
          <select id="origin-select" onchange="renderResults()">
            <option value="ALL">All Nearby Hubs (Compare Best)</option>
            <option value="KUL">🇲🇾 Kuala Lumpur (Malaysia - KUL)</option>
            <option value="BKK">🇹🇭 Bangkok (Thailand - BKK)</option>
            <option value="CGK">🇮🇩 Jakarta (Indonesia - CGK)</option>
            <option value="HKG">🇭🇰 Hong Kong (HKG)</option>
          </select>
        </div>
      </div>

      <div class="control-row two-col">
        <div>
          <label for="region-select">Region</label>
          <select id="region-select" onchange="onRegionChange()">
            <option value="ALL">All Regions</option>
            <option value="Asia Pacific">Asia Pacific</option>
            <option value="Australia & NZ">Australia & New Zealand</option>
            <option value="Europe">Europe</option>
            <option value="United States">United States</option>
          </select>
        </div>

        <div>
          <label for="dest-select">Destination Country / City</label>
          <select id="dest-select" onchange="renderResults()"></select>
        </div>
      </div>

      <div>
        <label>Cabin Class</label>
        <div class="cabin-toggle">
          <button class="cabin-btn active" id="cabin-economy" onclick="setCabin('Economy')">Economy</button>
          <button class="cabin-btn" id="cabin-business" onclick="setCabin('Business')">Business</button>
        </div>
      </div>
    </div>

    <!-- Results Header -->
    <div class="results-header">
      <div class="results-title" id="results-heading">Top 3 Redemptions</div>
      <div class="results-badge" id="results-subbadge">One-Way • Saver Rates</div>
